
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gemini Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <div class="logo">
                    ✦
                </div>

                <div>
                    <h2>Gemini</h2>
                    <span>AI Assistant</span>
                </div>
            </div>


            <button class="new-chat-btn" id="newChatBtn">
                <span>+</span>
                New Chat
            </button>


            <div class="sidebar-section">
                <p class="section-title">CHAT</p>

                <div class="chat-history">

                    <div class="history-item active">
                        <span>💬</span>
                        <span>New conversation</span>
                    </div>

                </div>
            </div>


            <div class="sidebar-bottom">

                <div class="sidebar-item">
                    <span>⚙</span>
                    Settings
                </div>

                <div class="sidebar-item">
                    <span>?</span>
                    Help
                </div>

            </div>

        </aside>


        <!-- MAIN CHAT AREA -->
        <main class="chat-container">

            <!-- HEADER -->
            <header class="chat-header">

                <div class="model-info">

                    <div class="gemini-icon">
                        ✦
                    </div>

                    <div>
                        <h3>Gemini</h3>
                        <p>gemini-3.6-flash</p>
                    </div>

                </div>


                <div class="header-actions">

                    <button title="Clear conversation" id="clearBtn">
                        🗑
                    </button>

                </div>

            </header>


            <!-- MESSAGES -->
            <section class="messages" id="messages">

                <!-- Welcome screen -->
                <div class="welcome" id="welcome">

                    <div class="welcome-icon">
                        ✦
                    </div>

                    <h1>How can I help you?</h1>

                    <p>
                        Ask me anything. I'm powered by Google's Gemini AI.
                    </p>


                    <div class="suggestions">

                        <button class="suggestion">
                            Explain recursion in Python
                        </button>

                        <button class="suggestion">
                            Give me a project idea
                        </button>

                        <button class="suggestion">
                            Explain how APIs work
                        </button>

                        <button class="suggestion">
                            Help me debug my code
                        </button>

                    </div>

                </div>

            </section>


            <!-- INPUT AREA -->
            <div class="input-area">

                <div class="input-wrapper">

                    <textarea
                        id="messageInput"
                        placeholder="Message Gemini..."
                        rows="1"
                    ></textarea>


                    <button
                        id="sendBtn"
                        class="send-btn"
                        title="Send message"
                    >
                        ➤
                    </button>

                </div>


                <div class="input-footer">
                    Gemini can make mistakes. Check important information.
                </div>

            </div>

        </main>

    </div>


    <script src="{{ url_for('static', path='js/chat.js') }}"></script>

</body>
</html>
